<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12">
      <div class="profile card card-body px-3 pt-3 pb-0">
        <div class="profile-head">
          <div class="photo-content">
            <!-- Optional: Add cover-photo or profile banner here -->
          </div>
          <div class="profile-info">
            <div *ngIf="profile() as profile" class="profile-details">
              <!-- <div class="profile-photo">
                <img src="/assets/public/images/profile/profile.png" class="img-fluid rounded-circle"
                  alt="Profile Photo" />
              </div> -->
              <div class="profile-name px-3 pt-2">
                <h4 class="text-muted mb-0">Name</h4>
                <p>{{ profile.dealer_name }}</p>

                <h4 class="text-muted mb-0">Email</h4>
                <p>{{ profile.dealer_email }}</p>

                <h4 class="text-muted mb-0">Location</h4>
                <p>{{ profile.location }}</p>

                <h4 class="text-muted mb-0">Mobile</h4>
                <p>{{ profile.mobile }}</p>
              </div>
            </div>

            <!-- Optional: Show message if no profile is loaded -->
            <div *ngIf="!profile()" class="text-center text-muted py-4">
              Loading profile details...
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
